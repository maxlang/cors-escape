name: Temporary numeric two-character .au Australian registrar cross-check

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check controls and all 38 first-pass candidates
        shell: python
        run: |
          import csv
          import hashlib
          import json
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          landing_url = "https://www.ddns.com.au/domains/bulkregister"
          endpoint = "https://www.ddns.com.au/cart.php"
          candidates = """
          09.au 0u.au 0x.au 16.au 1b.au 1j.au 1n.au 1p.au 1u.au 20.au
          24.au 2a.au 2f.au 2t.au 2u.au 36.au 3q.au 42.au 4d.au 4z.au
          54.au 5z.au 6d.au 6r.au 74.au 75.au 76.au 7l.au 8c.au 8t.au
          92.au 9c.au 9m.au a4.au d5.au q1.au w5.au x0.au
          """.split()
          assert len(candidates) == 38 and len(set(candidates)) == 38

          controls = [
              ("auda.au", False),
              ("xqzvkjhgfdsapoiuytrewq.au", True),
          ]

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json, text/javascript, */*; q=0.01",
              "Origin": "https://www.ddns.com.au",
              "Referer": landing_url,
              "User-Agent": "Mozilla/5.0 numeric-two-character-au-crosscheck/1.0",
              "X-Requested-With": "XMLHttpRequest",
          })

          def refresh_token():
              response = session.get(landing_url, timeout=45)
              response.raise_for_status()
              patterns = [
                  r'<input[^>]+name=["\']token["\'][^>]+value=["\']([^"\']+)',
                  r'<input[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']token["\']',
              ]
              for pattern in patterns:
                  match = re.search(pattern, response.text, flags=re.I)
                  if match:
                      return match.group(1)
              raise RuntimeError("Could not find registrar request token")

          token = refresh_token()

          def query(domain):
              global token
              last_error = None
              for attempt in range(4):
                  try:
                      response = session.post(
                          endpoint,
                          data={
                              "a": "checkDomain",
                              "domain": domain,
                              "type": "domain",
                              "token": token,
                          },
                          timeout=60,
                      )
                      if response.status_code != 200:
                          raise RuntimeError(
                              f"HTTP {response.status_code}: {response.text[:500]}"
                          )
                      payload = response.json()
                      rows = payload.get("result")
                      if not isinstance(rows, list) or len(rows) != 1:
                          raise ValueError(f"unexpected result: {payload!r}")
                      row = rows[0]
                      reported = str(row.get("domainName", "")).lower().rstrip(".")
                      if reported != domain:
                          raise ValueError(
                              f"domain mismatch: expected {domain}, got {reported}"
                          )
                      available = row.get("isAvailable")
                      registered = row.get("isRegistered")
                      valid = row.get("isValidDomain")
                      if available not in (True, False):
                          raise ValueError(f"missing boolean isAvailable: {row!r}")
                      if registered not in (True, False):
                          raise ValueError(f"missing boolean isRegistered: {row!r}")
                      if valid not in (True, False):
                          raise ValueError(f"missing boolean isValidDomain: {row!r}")
                      return {
                          "domain": domain,
                          "available": bool(available),
                          "registered": bool(registered),
                          "valid": bool(valid),
                          "status": row.get("status", ""),
                          "legacy_status": row.get("legacyStatus", ""),
                          "domain_error_message": row.get("domainErrorMessage", ""),
                          "premium": row.get("isPremium"),
                          "shortest_period": row.get("shortestPeriod"),
                          "error": "",
                          "raw": row,
                      }
                  except Exception as exc:
                      last_error = repr(exc)
                      if attempt < 3:
                          time.sleep(2 * (attempt + 1))
                          token = refresh_token()
              return {
                  "domain": domain,
                  "available": None,
                  "registered": None,
                  "valid": None,
                  "status": "",
                  "legacy_status": "",
                  "domain_error_message": "",
                  "premium": None,
                  "shortest_period": None,
                  "error": last_error,
                  "raw": None,
              }

          control_rows = []
          for domain, expected_available in controls:
              row = query(domain)
              control_rows.append(row)
              if row["available"] is not expected_available:
                  raise RuntimeError(
                      f"Control failed for {domain}: expected {expected_available}, got {row!r}"
                  )
              time.sleep(1.25)

          rows = []
          for index, domain in enumerate(candidates, start=1):
              row = query(domain)
              rows.append(row)
              print(
                  f"PROGRESS {index}/38 {domain} available={row['available']} "
                  f"registered={row['registered']} error={bool(row['error'])}",
                  flush=True,
              )
              if index < len(candidates):
                  time.sleep(1.25)

          errors = sorted(row["domain"] for row in rows if row["error"])
          invalid = sorted(row["domain"] for row in rows if row["valid"] is False)
          available = sorted(row["domain"] for row in rows if row["available"] is True)
          unavailable = sorted(row["domain"] for row in rows if row["available"] is False)
          registered = sorted(row["domain"] for row in rows if row["registered"] is True)
          blocked_or_other = sorted(
              row["domain"] for row in rows
              if row["available"] is False and row["registered"] is False
          )

          csv_path = Path("numeric-au-ddns-crosscheck.csv")
          with csv_path.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=[
                      "domain", "available", "registered", "valid", "status",
                      "legacy_status", "domain_error_message", "premium", "error",
                  ],
              )
              writer.writeheader()
              for row in rows:
                  writer.writerow({key: row[key] for key in writer.fieldnames})

          raw_path = Path("numeric-au-ddns-crosscheck-raw.json")
          raw_path.write_text(
              json.dumps({"controls": control_rows, "results": rows}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "registrar": "Discount Domain Name Services (Australia)",
              "method": "public registrar checkDomain endpoint, serial requests",
              "candidate_count": len(candidates),
              "available_count": len(available),
              "unavailable_count": len(unavailable),
              "registered_count": len(registered),
              "blocked_or_other_count": len(blocked_or_other),
              "invalid_count": len(invalid),
              "error_count": len(errors),
              "available": available,
              "unavailable": unavailable,
              "registered": registered,
              "blocked_or_other": blocked_or_other,
              "invalid": invalid,
              "errors": errors,
              "controls": control_rows,
              "csv_sha256": hashlib.sha256(csv_path.read_bytes()).hexdigest(),
              "raw_sha256": hashlib.sha256(raw_path.read_bytes()).hexdigest(),
          }
          Path("numeric-au-ddns-crosscheck-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("BEGIN_NUMERIC_AU_DDNS_SUMMARY")
          print(json.dumps(summary, sort_keys=True, separators=(",", ":")))
          print("END_NUMERIC_AU_DDNS_SUMMARY")

          if errors or invalid or len(available) + len(unavailable) != len(candidates):
              raise SystemExit("Australian registrar cross-check was incomplete or invalid")

      - name: Upload exact cross-check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeric-au-ddns-crosscheck
          path: |
            numeric-au-ddns-crosscheck-summary.json
            numeric-au-ddns-crosscheck.csv
            numeric-au-ddns-crosscheck-raw.json
          if-no-files-found: warn
          retention-days: 2
