name: Temporary numeric two-character .au cross-check

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cross-check all 38 first-pass candidates
        shell: python
        run: |
          import csv
          import hashlib
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          page_url = "https://stack2.au/tools/domain-checker"
          candidates = """
          09.au 0u.au 0x.au 16.au 1b.au 1j.au 1n.au 1p.au 1u.au 20.au
          24.au 2a.au 2f.au 2t.au 2u.au 36.au 3q.au 42.au 4d.au 4z.au
          54.au 5z.au 6d.au 6r.au 74.au 75.au 76.au 7l.au 8c.au 8t.au
          92.au 9c.au 9m.au a4.au d5.au q1.au w5.au x0.au
          """.split()
          assert len(candidates) == 38
          assert len(set(candidates)) == 38

          controls = {
              "auda.au": False,
              "xqzvkjhgfdsapoiuytrewq.au": True,
          }

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json, text/plain, */*",
              "Origin": "https://stack2.au",
              "Referer": page_url,
              "User-Agent": "Mozilla/5.0 numeric-two-character-au-crosscheck/1.0",
          })
          landing = session.get(page_url, timeout=30)
          landing.raise_for_status()

          def query(domain):
              last_error = None
              for attempt in range(4):
                  try:
                      response = session.post(
                          page_url,
                          data={"domain": domain},
                          timeout=45,
                      )
                      if response.status_code != 200:
                          last_error = f"HTTP {response.status_code}: {response.text[:500]}"
                      else:
                          payload = response.json()
                          if not isinstance(payload, dict):
                              raise ValueError(f"unexpected payload type: {type(payload).__name__}")
                          if payload.get("domain", "").lower().rstrip(".") != domain:
                              raise ValueError(f"domain mismatch: {payload!r}")
                          if payload.get("hasError") is True:
                              raise RuntimeError(payload.get("errorMessage") or "checker reported an error")
                          value = payload.get("isAvailable")
                          if value not in (True, False):
                              raise ValueError(f"missing boolean isAvailable: {payload!r}")
                          return {
                              "domain": domain,
                              "available": bool(value),
                              "has_error": bool(payload.get("hasError", False)),
                              "error_message": payload.get("errorMessage", ""),
                              "raw": payload,
                          }
                  except Exception as exc:
                      last_error = repr(exc)
                  if attempt < 3:
                      time.sleep(1.5 * (attempt + 1))
              return {
                  "domain": domain,
                  "available": None,
                  "has_error": True,
                  "error_message": last_error,
                  "raw": None,
              }

          control_rows = []
          for domain, expected in controls.items():
              row = query(domain)
              control_rows.append(row)
              if row["available"] is not expected:
                  raise RuntimeError(
                      f"Control failed for {domain}: expected {expected}, got {row!r}"
                  )
              time.sleep(1)

          rows = []
          for index, domain in enumerate(candidates):
              rows.append(query(domain))
              if index + 1 < len(candidates):
                  time.sleep(0.8)

          errors = sorted(row["domain"] for row in rows if row["available"] is None)
          available = sorted(row["domain"] for row in rows if row["available"] is True)
          unavailable = sorted(row["domain"] for row in rows if row["available"] is False)

          csv_path = Path("numeric-au-stack2-crosscheck.csv")
          with csv_path.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=["domain", "available", "has_error", "error_message"],
              )
              writer.writeheader()
              for row in rows:
                  writer.writerow({key: row[key] for key in writer.fieldnames})

          raw_path = Path("numeric-au-stack2-crosscheck-raw.json")
          raw_path.write_text(
              json.dumps({"controls": control_rows, "results": rows}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "checker": "Stack2 .au Domain Checker",
              "checker_url": page_url,
              "first_pass_candidate_count": len(candidates),
              "crosscheck_available_count": len(available),
              "crosscheck_unavailable_count": len(unavailable),
              "crosscheck_error_count": len(errors),
              "available": available,
              "unavailable": unavailable,
              "errors": errors,
              "controls": control_rows,
              "csv_sha256": hashlib.sha256(csv_path.read_bytes()).hexdigest(),
              "raw_sha256": hashlib.sha256(raw_path.read_bytes()).hexdigest(),
          }
          Path("numeric-au-stack2-crosscheck-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("BEGIN_STACK2_NUMERIC_AU_SUMMARY")
          print(json.dumps(summary, sort_keys=True, separators=(",", ":")))
          print("END_STACK2_NUMERIC_AU_SUMMARY")

          if errors or len(available) + len(unavailable) != len(candidates):
              raise SystemExit("Cross-check did not return a complete conclusive result set")

      - name: Upload exact cross-check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeric-au-stack2-crosscheck
          path: |
            numeric-au-stack2-crosscheck-summary.json
            numeric-au-stack2-crosscheck.csv
            numeric-au-stack2-crosscheck-raw.json
          if-no-files-found: warn
          retention-days: 2
