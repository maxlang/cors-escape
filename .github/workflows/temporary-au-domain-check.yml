name: Temporary numeric two-character .au registrar verification

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the bulk registrar-check client
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/davejoelwilson/domain-checker.git checker

      - name: Check all 620 two-character names containing a digit
        shell: python
        run: |
          import csv
          import hashlib
          import importlib.util
          import json
          import string
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          module_path = Path("checker/domcheck.py")
          spec = importlib.util.spec_from_file_location("domcheck", module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          alphabet = string.ascii_lowercase + string.digits
          domains = [
              f"{a}{b}.au"
              for a in alphabet
              for b in alphabet
              if a.isdigit() or b.isdigit()
          ]
          assert len(domains) == 620 and len(set(domains)) == 620

          controls = ["auda.au", "xqzvkjhgfdsapoiuytrewq.au"]
          requested = controls + domains
          results = module.check_domains_batched(
              requested,
              batch_size=20,
              delay=0.8,
          )

          by_name = {}
          duplicates = []
          malformed = []
          for result in results:
              name = str(result.get("name", "")).lower().rstrip(".")
              if not name:
                  malformed.append(result)
                  continue
              if name in by_name:
                  duplicates.append(name)
              by_name[name] = result

          missing = sorted(set(requested) - set(by_name))
          extra = sorted(set(by_name) - set(requested))
          errors = sorted(
              name for name, result in by_name.items()
              if result.get("error")
          )
          ambiguous = sorted(
              name for name, result in by_name.items()
              if not result.get("error") and result.get("available") not in (True, False)
          )

          if by_name.get("auda.au", {}).get("available") is not False:
              raise RuntimeError(f"Known-taken control failed: {by_name.get('auda.au')!r}")
          if by_name.get("xqzvkjhgfdsapoiuytrewq.au", {}).get("available") is not True:
              raise RuntimeError(
                  f"Known-available control failed: {by_name.get('xqzvkjhgfdsapoiuytrewq.au')!r}"
              )

          available = sorted(
              domain for domain in domains
              if by_name.get(domain, {}).get("available") is True
          )
          unavailable = sorted(
              domain for domain in domains
              if by_name.get(domain, {}).get("available") is False
          )

          csv_path = Path("two-character-au-numeric-namecheap.csv")
          with csv_path.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=[
                      "domain", "available", "error", "registrar",
                      "created_year", "extensions_taken",
                  ],
              )
              writer.writeheader()
              for domain in domains:
                  row = by_name.get(domain, {})
                  extra_data = row.get("extra") or {}
                  whois = row.get("whois") or {}
                  writer.writerow({
                      "domain": domain,
                      "available": row.get("available"),
                      "error": row.get("error", ""),
                      "registrar": extra_data.get("registrar", ""),
                      "created_year": extra_data.get("createdYear") or whois.get("createdYear", ""),
                      "extensions_taken": extra_data.get("extensionsTaken", ""),
                  })

          raw_path = Path("two-character-au-numeric-namecheap-raw.json")
          raw_path.write_text(
              json.dumps(results, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          summary = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "method": "Namecheap availability backend via davejoelwilson/domain-checker",
              "checker_commit": subprocess.run(
                  ["git", "-C", "checker", "rev-parse", "HEAD"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip(),
              "numeric_domain_count": len(domains),
              "available_count": len(available),
              "unavailable_count": len(unavailable),
              "available": available,
              "missing": missing,
              "extra": extra,
              "duplicates": sorted(set(duplicates)),
              "malformed_count": len(malformed),
              "errors": errors,
              "ambiguous": ambiguous,
              "controls": {
                  "auda.au": by_name.get("auda.au"),
                  "xqzvkjhgfdsapoiuytrewq.au": by_name.get("xqzvkjhgfdsapoiuytrewq.au"),
              },
              "csv_sha256": hashlib.sha256(csv_path.read_bytes()).hexdigest(),
              "raw_sha256": hashlib.sha256(raw_path.read_bytes()).hexdigest(),
          }
          Path("two-character-au-numeric-namecheap-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path("two-character-au-numeric-namecheap-available.txt").write_text(
              "\n".join(available) + ("\n" if available else ""),
              encoding="utf-8",
          )

          print("BEGIN_NUMERIC_AU_NAMECHEAP_SUMMARY")
          print(json.dumps(summary, sort_keys=True, separators=(",", ":")))
          print("END_NUMERIC_AU_NAMECHEAP_SUMMARY")

          if missing or extra or duplicates or malformed or errors or ambiguous:
              raise SystemExit("Registrar result set was incomplete or ambiguous")
          if len(available) + len(unavailable) != len(domains):
              raise SystemExit("Not all 620 names received a conclusive result")

      - name: Upload exact results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-character-au-numeric-namecheap
          path: |
            two-character-au-numeric-namecheap-summary.json
            two-character-au-numeric-namecheap.csv
            two-character-au-numeric-namecheap-available.txt
            two-character-au-numeric-namecheap-raw.json
          if-no-files-found: warn
          retention-days: 2
