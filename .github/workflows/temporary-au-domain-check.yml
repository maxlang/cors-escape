name: Temporary .au checker endpoint inspection

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Stack2 domain-checker frontend and one live request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          import urllib.parse
          import urllib.request

          page_url = "https://stack2.au/tools/domain-checker"
          req = urllib.request.Request(page_url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              page = response.read().decode("utf-8", "replace")
          print("PAGE_STATUS=200")
          print("PAGE_BYTES=" + str(len(page)))

          srcs = []
          for raw in re.findall(r'<script[^>]+src=["\']([^"\']+)', page, flags=re.I):
              url = urllib.parse.urljoin(page_url, html.unescape(raw))
              if url not in srcs:
                  srcs.append(url)
          print("SCRIPT_COUNT=" + str(len(srcs)))
          for src in srcs:
              print("SCRIPT=" + src)

          needles = [
              "domain-check", "availability", "available", "/api/", "fetch(",
              "whois", "registry", "check-domain", "domainChecker"
          ]
          for src in srcs:
              try:
                  req = urllib.request.Request(src, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      text = response.read().decode("utf-8", "replace")
              except Exception as exc:
                  print("SCRIPT_ERROR=" + src + " " + repr(exc))
                  continue
              low = text.lower()
              hits = []
              for needle in needles:
                  start = 0
                  nlow = needle.lower()
                  while True:
                      idx = low.find(nlow, start)
                      if idx < 0:
                          break
                      snippet = text[max(0, idx-220):min(len(text), idx+420)]
                      snippet = re.sub(r"\s+", " ", snippet)
                      hits.append((idx, needle, snippet))
                      start = idx + len(nlow)
                      if len(hits) >= 40:
                          break
                  if len(hits) >= 40:
                      break
              if hits:
                  print("BEGIN_SCRIPT_HITS " + src)
                  for idx, needle, snippet in hits:
                      print(json.dumps({"offset": idx, "needle": needle, "snippet": snippet}, ensure_ascii=False))
                  print("END_SCRIPT_HITS")
          PY
