name: Temporary numeric .au bulk-check trace

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Playwright Python package
        run: python -m pip install --quiet playwright

      - name: Trace Naked Whois sample lookup
        shell: python
        run: |
          import json
          import os
          import re
          from playwright.sync_api import sync_playwright

          controls = [
              "auda.au",
              "xqzvkjhgfdsapoiuytrewq.au",
              "00.au",
              "a0.au",
              "0a.au",
              "99.au",
          ]
          events = []

          with sync_playwright() as p:
              executable = "/usr/bin/google-chrome"
              browser = p.chromium.launch(
                  executable_path=executable if os.path.exists(executable) else None,
                  headless=True,
                  args=["--no-sandbox"],
              )
              page = browser.new_page(viewport={"width": 1440, "height": 1200})

              def on_request(request):
                  if request.resource_type in {"xhr", "fetch"}:
                      events.append({
                          "kind": "request",
                          "resource_type": request.resource_type,
                          "method": request.method,
                          "url": request.url,
                          "post_data": request.post_data,
                      })

              def on_response(response):
                  request = response.request
                  if request.resource_type in {"xhr", "fetch"}:
                      item = {
                          "kind": "response",
                          "resource_type": request.resource_type,
                          "method": request.method,
                          "url": response.url,
                          "status": response.status,
                          "content_type": response.headers.get("content-type", ""),
                      }
                      try:
                          item["body"] = response.text()[:30000]
                      except Exception as exc:
                          item["body_error"] = repr(exc)
                      events.append(item)

              page.on("request", on_request)
              page.on("response", on_response)
              page.goto("https://nakedwhois.com/", wait_until="networkidle", timeout=90000)

              fields = page.locator("textarea:visible")
              if fields.count() == 0:
                  raise RuntimeError("No visible textarea found")
              fields.first.fill("\n".join(controls))

              buttons = page.get_by_role("button", name=re.compile(r"Check Availability", re.I))
              if buttons.count() == 0:
                  buttons = page.locator("button:visible")
              buttons.first.click()

              page.wait_for_timeout(15000)
              body = page.locator("body").inner_text()
              rows = page.locator("table tbody tr")
              row_texts = [rows.nth(i).inner_text() for i in range(rows.count())]

              print("BEGIN_NAKEDWHOIS_TRACE")
              print(json.dumps({
                  "controls": controls,
                  "url": page.url,
                  "row_count": rows.count(),
                  "rows": row_texts,
                  "events": events,
                  "body_text": body[:50000],
              }, ensure_ascii=False))
              print("END_NAKEDWHOIS_TRACE")
              page.screenshot(path="nakedwhois-sample.png", full_page=True)
              browser.close()

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nakedwhois-sample
          path: nakedwhois-sample.png
          if-no-files-found: warn
          retention-days: 1
