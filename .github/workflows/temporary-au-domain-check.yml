name: Temporary auDA availability-service probe

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query known controls and disputed short names
        shell: python
        run: |
          import json
          import socket
          import time

          host = "domaincheck.auda.org.au"
          domains = [
              "auda.au",
              "xqzvkjhgfdsapoiuytrewq.au",
              "4f.au",
              "4z.au",
              "6d.au",
              "7l.au",
          ]
          results = []

          for domain in domains:
              try:
                  with socket.create_connection((host, 43), timeout=20) as sock:
                      sock.settimeout(20)
                      sock.sendall((domain + "\r\n").encode("ascii"))
                      chunks = []
                      while True:
                          try:
                              chunk = sock.recv(65536)
                          except socket.timeout:
                              break
                          if not chunk:
                              break
                          chunks.append(chunk)
                  text = b"".join(chunks).decode("utf-8", "replace")
                  results.append({"domain": domain, "response": text})
              except Exception as exc:
                  results.append({"domain": domain, "error": repr(exc)})
              time.sleep(1.5)

          print("BEGIN_AUDA_DOMAINCHECK_PROBE")
          print(json.dumps(results, ensure_ascii=False))
          print("END_AUDA_DOMAINCHECK_PROBE")
