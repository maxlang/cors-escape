name: Temporary numeric two-character .au fast browser cross-check

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Playwright Python package
        run: python -m pip install --quiet playwright

      - name: Check controls and all 38 first-pass candidates
        shell: python
        run: |
          import csv
          import hashlib
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          page_url = "https://stack2.au/tools/domain-checker"
          candidates = """
          09.au 0u.au 0x.au 16.au 1b.au 1j.au 1n.au 1p.au 1u.au 20.au
          24.au 2a.au 2f.au 2t.au 2u.au 36.au 3q.au 42.au 4d.au 4z.au
          54.au 5z.au 6d.au 6r.au 74.au 75.au 76.au 7l.au 8c.au 8t.au
          92.au 9c.au 9m.au a4.au d5.au q1.au w5.au x0.au
          """.split()
          assert len(candidates) == 38 and len(set(candidates)) == 38

          controls = [
              ("auda.au", False),
              ("xqzvkjhgfdsapoiuytrewq.au", True),
          ]

          with sync_playwright() as p:
              executable = "/usr/bin/google-chrome"
              browser = p.chromium.launch(
                  executable_path=executable if os.path.exists(executable) else None,
                  headless=True,
                  args=["--no-sandbox"],
              )
              page = browser.new_page(viewport={"width": 1280, "height": 900})
              page.goto(page_url, wait_until="networkidle", timeout=90000)

              def controls_for_page():
                  fields = page.locator("input:visible")
                  field = None
                  for i in range(fields.count()):
                      candidate = fields.nth(i)
                      field_type = (candidate.get_attribute("type") or "text").lower()
                      if field_type in {"text", "search"}:
                          field = candidate
                          break
                  if field is None:
                      raise RuntimeError("No visible text/search input found")

                  buttons = page.get_by_role("button", name=re.compile(r"^Check$", re.I))
                  if buttons.count() == 0:
                      buttons = page.locator("button:visible")
                  if buttons.count() == 0:
                      raise RuntimeError("No visible Check button found")
                  return field, buttons.first

              def query(domain):
                  last_error = None
                  for attempt in range(3):
                      try:
                          field, button = controls_for_page()
                          field.fill(domain)
                          button.wait_for(state="visible", timeout=30000)
                          with page.expect_response(
                              lambda response: response.url == page_url
                              and response.request.method == "POST",
                              timeout=90000,
                          ) as response_info:
                              button.click()
                          response = response_info.value
                          body = response.text()
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}: {body[:500]}")
                          payload = json.loads(body)
                          reported = str(payload.get("domain", "")).lower().rstrip(".")
                          if reported != domain:
                              raise ValueError(f"domain mismatch: expected {domain}, got {reported}")
                          if payload.get("hasError") is True:
                              raise RuntimeError(payload.get("errorMessage") or "checker error")
                          available = payload.get("isAvailable")
                          if available not in (True, False):
                              raise ValueError(f"missing boolean isAvailable: {payload!r}")
                          page.wait_for_timeout(200)
                          return {
                              "domain": domain,
                              "available": bool(available),
                              "has_error": False,
                              "error_message": "",
                              "raw": payload,
                          }
                      except Exception as exc:
                          last_error = repr(exc)
                          page.reload(wait_until="networkidle", timeout=90000)
                          if attempt < 2:
                              time.sleep(attempt + 1)
                  return {
                      "domain": domain,
                      "available": None,
                      "has_error": True,
                      "error_message": last_error,
                      "raw": None,
                  }

              control_rows = []
              for domain, expected in controls:
                  row = query(domain)
                  control_rows.append(row)
                  if row["available"] is not expected:
                      raise RuntimeError(
                          f"Control failed for {domain}: expected {expected}, got {row!r}"
                      )

              rows = [query(domain) for domain in candidates]
              browser.close()

          errors = sorted(row["domain"] for row in rows if row["available"] is None)
          available = sorted(row["domain"] for row in rows if row["available"] is True)
          unavailable = sorted(row["domain"] for row in rows if row["available"] is False)

          csv_path = Path("numeric-au-stack2-crosscheck.csv")
          with csv_path.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=["domain", "available", "has_error", "error_message"],
              )
              writer.writeheader()
              for row in rows:
                  writer.writerow({key: row[key] for key in writer.fieldnames})

          raw_path = Path("numeric-au-stack2-crosscheck-raw.json")
          raw_path.write_text(
              json.dumps({"controls": control_rows, "results": rows}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          summary = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "checker": "Stack2 .au Domain Checker",
              "method": "browser submission through the public checker form",
              "first_pass_candidate_count": len(candidates),
              "crosscheck_available_count": len(available),
              "crosscheck_unavailable_count": len(unavailable),
              "crosscheck_error_count": len(errors),
              "available": available,
              "unavailable": unavailable,
              "errors": errors,
              "controls": control_rows,
              "csv_sha256": hashlib.sha256(csv_path.read_bytes()).hexdigest(),
              "raw_sha256": hashlib.sha256(raw_path.read_bytes()).hexdigest(),
          }
          Path("numeric-au-stack2-crosscheck-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print("BEGIN_STACK2_NUMERIC_AU_SUMMARY")
          print(json.dumps(summary, sort_keys=True, separators=(",", ":")))
          print("END_STACK2_NUMERIC_AU_SUMMARY")

          if errors or len(available) + len(unavailable) != len(candidates):
              raise SystemExit("Cross-check did not return a complete conclusive result set")

      - name: Upload exact cross-check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeric-au-stack2-crosscheck-fast
          path: |
            numeric-au-stack2-crosscheck-summary.json
            numeric-au-stack2-crosscheck.csv
            numeric-au-stack2-crosscheck-raw.json
          if-no-files-found: warn
          retention-days: 2
