name: Temporary .au registrar UI validation

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright

      - name: Submit a small control batch through the registrar's public bulk-search form
        shell: python
        run: |
          import json
          import os
          import re
          from playwright.sync_api import sync_playwright

          controls = [
              "ao.au",
              "aa.au",
              "lq.au",
              "vq.au",
              "xqzvkjhgfdsapoiuytrewq.au",
          ]

          with sync_playwright() as p:
              executable = "/usr/bin/google-chrome"
              browser = p.chromium.launch(
                  executable_path=executable if os.path.exists(executable) else None,
                  headless=True,
                  args=["--no-sandbox"],
              )
              page = browser.new_page(viewport={"width": 1440, "height": 1200})
              page.goto("https://www.ddns.com.au/domains/bulkregister", wait_until="networkidle", timeout=90000)

              candidates = page.locator("textarea:visible")
              if candidates.count() == 0:
                  candidates = page.locator("input[type=text]:visible")
              if candidates.count() == 0:
                  raise RuntimeError("No visible bulk-search input found")

              field = candidates.first
              field.fill("\n".join(controls))

              buttons = page.get_by_role("button", name=re.compile(r"^Search$", re.I))
              if buttons.count() == 0:
                  buttons = page.locator("input[type=submit][value*='Search' i]:visible")
              if buttons.count() == 0:
                  raise RuntimeError("No visible Search button found")

              buttons.first.click()
              page.wait_for_timeout(8000)
              page.wait_for_load_state("networkidle", timeout=90000)
              body = page.locator("body").inner_text()

              print("BEGIN_CONTROL_RESULT")
              print(json.dumps({
                  "url": page.url,
                  "controls": controls,
                  "body_text": body,
              }, ensure_ascii=False))
              print("END_CONTROL_RESULT")
              page.screenshot(path="ddns-control-result.png", full_page=True)
              browser.close()

      - name: Upload control screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddns-control-result
          path: ddns-control-result.png
          if-no-files-found: warn
          retention-days: 1
