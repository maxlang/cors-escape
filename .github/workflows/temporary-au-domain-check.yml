name: Temporary Stack2 .au availability trace

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright Python package
        run: python -m pip install --quiet playwright

      - name: Trace independent checks
        shell: python
        run: |
          import json
          import os
          import re
          from playwright.sync_api import sync_playwright

          domains = [
              "auda.au",
              "xqzvkjhgfdsapoiuytrewq.au",
              "09.au",
              "00.au",
              "a4.au",
              "4z.au",
          ]
          output = []

          with sync_playwright() as p:
              executable = "/usr/bin/google-chrome"
              browser = p.chromium.launch(
                  executable_path=executable if os.path.exists(executable) else None,
                  headless=True,
                  args=["--no-sandbox"],
              )

              for domain in domains:
                  events = []
                  page = browser.new_page(viewport={"width": 1440, "height": 1000})

                  def on_request(request):
                      if request.resource_type in {"xhr", "fetch", "document"}:
                          events.append({
                              "kind": "request",
                              "resource_type": request.resource_type,
                              "method": request.method,
                              "url": request.url,
                              "post_data": request.post_data,
                          })

                  def on_response(response):
                      request = response.request
                      if request.resource_type in {"xhr", "fetch", "document"}:
                          item = {
                              "kind": "response",
                              "resource_type": request.resource_type,
                              "method": request.method,
                              "url": response.url,
                              "status": response.status,
                              "content_type": response.headers.get("content-type", ""),
                          }
                          try:
                              if request.resource_type in {"xhr", "fetch"}:
                                  item["body"] = response.text()[:20000]
                          except Exception as exc:
                              item["body_error"] = repr(exc)
                          events.append(item)

                  page.on("request", on_request)
                  page.on("response", on_response)
                  page.goto("https://stack2.au/tools/domain-checker", wait_until="networkidle", timeout=90000)

                  fields = page.locator("input:visible")
                  chosen = None
                  for i in range(fields.count()):
                      field = fields.nth(i)
                      try:
                          if field.get_attribute("type") in (None, "text", "search"):
                              chosen = field
                              break
                      except Exception:
                          pass
                  if chosen is None:
                      raise RuntimeError("No visible text/search input found")
                  chosen.fill(domain)

                  buttons = page.get_by_role("button", name=re.compile(r"^Check$", re.I))
                  if buttons.count() == 0:
                      buttons = page.locator("button:visible")
                  buttons.first.click()
                  page.wait_for_timeout(7000)

                  output.append({
                      "domain": domain,
                      "url": page.url,
                      "body_text": page.locator("body").inner_text()[:30000],
                      "events": events,
                  })
                  page.close()

              browser.close()

          print("BEGIN_STACK2_TRACE")
          print(json.dumps(output, ensure_ascii=False))
          print("END_STACK2_TRACE")
