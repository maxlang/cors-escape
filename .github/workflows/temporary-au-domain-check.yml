name: Temporary two-letter .au registrar check

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch audited bulk checker
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/davejoelwilson/domain-checker.git checker

      - name: Check all 676 letter-only direct .au names
        shell: python
        run: |
          import hashlib
          import importlib.util
          import json
          import string
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          module_path = Path("checker/domcheck.py")
          spec = importlib.util.spec_from_file_location("domcheck", module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          requested = [f"{a}{b}.au" for a in string.ascii_lowercase for b in string.ascii_lowercase]
          assert len(requested) == 676 and len(set(requested)) == 676

          results = module.check_domains_batched(requested, batch_size=20, delay=0.75)
          by_name = {}
          duplicates = []
          malformed = []
          for result in results:
              name = str(result.get("name", "")).lower().rstrip(".")
              if not name:
                  malformed.append(result)
                  continue
              if name in by_name:
                  duplicates.append(name)
              by_name[name] = result

          missing = sorted(set(requested) - set(by_name))
          extra = sorted(set(by_name) - set(requested))
          errors = sorted(
              name for name, result in by_name.items()
              if result.get("error")
          )
          available = sorted(
              name for name, result in by_name.items()
              if result.get("available") is True and not result.get("error")
          )
          unavailable = sorted(
              name for name, result in by_name.items()
              if result.get("available") is False and not result.get("error")
          )
          ambiguous = sorted(
              name for name, result in by_name.items()
              if result.get("available") not in (True, False) and not result.get("error")
          )

          raw_path = Path("two-letter-au-namecheap-raw.json")
          raw_path.write_text(
              json.dumps(results, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          summary = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "method": "Namecheap bulk availability backend via davejoelwilson/domain-checker",
              "checker_commit": "$(git -C checker rev-parse HEAD)",
              "requested_count": len(requested),
              "returned_count": len(results),
              "unique_returned_count": len(by_name),
              "available_count": len(available),
              "unavailable_count": len(unavailable),
              "error_count": len(errors),
              "ambiguous_count": len(ambiguous),
              "available": available,
              "errors": errors,
              "ambiguous": ambiguous,
              "missing": missing,
              "extra": extra,
              "duplicates": sorted(set(duplicates)),
              "malformed_count": len(malformed),
              "raw_sha256": hashlib.sha256(raw_path.read_bytes()).hexdigest(),
          }
          # Replace the literal shell placeholder with the actual commit, without shell interpolation risks.
          import subprocess
          summary["checker_commit"] = subprocess.run(
              ["git", "-C", "checker", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()

          Path("two-letter-au-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("BEGIN_TWO_LETTER_AU_SUMMARY")
          print(json.dumps(summary, sort_keys=True, separators=(",", ":")))
          print("END_TWO_LETTER_AU_SUMMARY")

          if missing or extra or duplicates or malformed or errors or ambiguous:
              raise SystemExit("Registrar response did not fully and unambiguously cover all 676 names")

      - name: Upload exact results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-letter-au-results
          path: |
            two-letter-au-summary.json
            two-letter-au-namecheap-raw.json
          if-no-files-found: warn
          retention-days: 1
