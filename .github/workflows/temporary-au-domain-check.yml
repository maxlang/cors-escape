name: Temporary two-letter .au availability check

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ensure DNS query tool is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq bind9-dnsutils
          fi
          dig -v

      - name: Query the authoritative .au nameservers for all 676 names
        shell: python
        run: |
          import concurrent.futures
          import hashlib
          import json
          import re
          import string
          import subprocess
          from datetime import datetime, timezone

          domains = [f"{a}{b}.au" for a in string.ascii_lowercase for b in string.ascii_lowercase]
          assert len(domains) == 676 and len(set(domains)) == 676

          ns_lookup = subprocess.run(
              ["dig", "+short", "NS", "au."],
              check=True,
              capture_output=True,
              text=True,
              timeout=30,
          )
          nameservers = sorted({line.strip().rstrip(".") for line in ns_lookup.stdout.splitlines() if line.strip()})
          if not nameservers:
              raise RuntimeError("Could not discover the authoritative .au nameservers")

          status_re = re.compile(r"status:\s*([A-Z]+)")

          def one_query(domain, nameserver):
              completed = subprocess.run(
                  [
                      "dig",
                      f"@{nameserver}",
                      domain + ".",
                      "NS",
                      "+norecurse",
                      "+time=4",
                      "+tries=2",
                      "+noall",
                      "+comments",
                      "+answer",
                  ],
                  capture_output=True,
                  text=True,
                  timeout=12,
              )
              text = completed.stdout + "\n" + completed.stderr
              match = status_re.search(text)
              status = match.group(1) if match else "NO_STATUS"
              ns_answers = [
                  line.strip()
                  for line in completed.stdout.splitlines()
                  if line.strip() and not line.startswith(";") and re.search(r"\sNS\s", line)
              ]
              return status, ns_answers, text[-1000:]

          def classify(item):
              index, domain = item
              attempts = []
              # Round-robin across the authoritative fleet, retrying on a second server
              # only when the first answer is not conclusive.
              for offset in range(min(2, len(nameservers))):
                  nameserver = nameservers[(index + offset) % len(nameservers)]
                  try:
                      status, answers, raw_tail = one_query(domain, nameserver)
                  except Exception as exc:
                      attempts.append({"nameserver": nameserver, "error": repr(exc)})
                      continue
                  attempts.append({"nameserver": nameserver, "status": status, "answers": answers})
                  if status == "NXDOMAIN":
                      return domain, "dns_absent", attempts
                  if status == "NOERROR" and answers:
                      return domain, "delegated", attempts
                  if status == "NOERROR":
                      return domain, "no_ns_answer", attempts
              return domain, "unknown", attempts

          groups = {"delegated": [], "dns_absent": [], "no_ns_answer": [], "unknown": []}
          details = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              for domain, classification, attempts in pool.map(classify, enumerate(domains)):
                  groups[classification].append(domain)
                  if classification != "delegated":
                      details[domain] = attempts

          for values in groups.values():
              values.sort()

          canonical = json.dumps(groups, sort_keys=True, separators=(",", ":")).encode("utf-8")
          summary = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "method": "authoritative DNS NS query against the .au parent zone",
              "checked": len(domains),
              "authoritative_nameservers": nameservers,
              "counts": {key: len(value) for key, value in groups.items()},
              "dns_absent": groups["dns_absent"],
              "no_ns_answer": groups["no_ns_answer"],
              "unknown": groups["unknown"],
              "nondelegated_details": details,
              "classification_sha256": hashlib.sha256(canonical).hexdigest(),
          }
          print("BEGIN_AU_DNS_RESULT")
          print(json.dumps(summary, sort_keys=True, separators=(",", ":")))
          print("END_AU_DNS_RESULT")
