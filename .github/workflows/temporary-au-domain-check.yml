name: Temporary .au registrar submission trace

on:
  push:
    branches:
      - chatgpt-au-domain-check-20260903

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser driver
        shell: bash
        run: python -m pip install --quiet playwright

      - name: Trace a normal supported bulk-search submission
        shell: python
        run: |
          import json
          import os
          import re
          from playwright.sync_api import sync_playwright

          controls = ["auda.au", "xqzvkjhgfdsapoiuytrewq.au"]
          events = []

          with sync_playwright() as p:
              executable = "/usr/bin/google-chrome"
              browser = p.chromium.launch(
                  executable_path=executable if os.path.exists(executable) else None,
                  headless=True,
                  args=["--no-sandbox"],
              )
              page = browser.new_page(viewport={"width": 1440, "height": 1200})
              page.goto("https://www.ddns.com.au/domains/bulkregister", wait_until="networkidle", timeout=90000)

              def on_request(request):
                  if request.resource_type in {"xhr", "fetch", "document"}:
                      events.append({
                          "kind": "request",
                          "resource_type": request.resource_type,
                          "method": request.method,
                          "url": request.url,
                          "post_data": request.post_data,
                      })

              def on_response(response):
                  request = response.request
                  if request.resource_type in {"xhr", "fetch", "document"}:
                      item = {
                          "kind": "response",
                          "resource_type": request.resource_type,
                          "method": request.method,
                          "url": response.url,
                          "status": response.status,
                          "content_type": response.headers.get("content-type", ""),
                      }
                      try:
                          if "json" in item["content_type"] or request.resource_type in {"xhr", "fetch"}:
                              item["body"] = response.text()[:20000]
                      except Exception as exc:
                          item["body_error"] = repr(exc)
                      events.append(item)

              page.on("request", on_request)
              page.on("response", on_response)

              field = page.locator("textarea:visible").first
              field.fill("\n".join(controls))
              page.get_by_role("button", name=re.compile(r"^Search$", re.I)).first.click()
              page.wait_for_timeout(10000)
              page.wait_for_load_state("networkidle", timeout=90000)
              body = page.locator("body").inner_text()

              print("BEGIN_TRACE_RESULT")
              print(json.dumps({
                  "controls": controls,
                  "events": events,
                  "body_text": body,
                  "url": page.url,
              }, ensure_ascii=False))
              print("END_TRACE_RESULT")
              browser.close()
